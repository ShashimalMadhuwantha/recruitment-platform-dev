name: Monorepo CI Pipeline

on:
  push:
    branches: [main, develop, 'epic/**', 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  validate-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=backend
        env:
          DATABASE_URL: 'mysql://root:root@localhost:3306/recruitment_test_db'

      - name: Typecheck Shared, Backend & Frontend
        run: npm run typecheck

      - name: Run Backend Unit & Integration Tests
        run: npm run test:backend
        env:
          NODE_ENV: test
          DATABASE_URL: 'mysql://root:root@localhost:3306/recruitment_test_db'
          JWT_SECRET: 'test-secret-jwt-key-min-32-chars-long'

      - name: Run Frontend Component Tests
        run: npm run test:frontend

      - name: Build All Workspaces
        run: npm run build
